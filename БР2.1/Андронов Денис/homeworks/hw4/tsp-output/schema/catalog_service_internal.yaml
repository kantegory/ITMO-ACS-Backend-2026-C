openapi: 3.0.0
info:
  title: Catalog Service Internal API
  version: 0.0.0
paths:
  /internal/api/restaurants/{id}/check:
    get:
      summary: Получение базовой информации о ресторане
      description: Возвращает статус ресторана для сервиса бронирования.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ресторан доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  isActive: { type: boolean }
        '404':
          description: Ресторан удален или не существует