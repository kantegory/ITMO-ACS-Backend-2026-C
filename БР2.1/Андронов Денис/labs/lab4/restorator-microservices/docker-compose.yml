services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: restorator-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restorator-network

  postgres:
    image: postgres:16-alpine
    container_name: restorator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - restorator-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: restorator-auth-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: auth_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - restorator-network

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: restorator-catalog-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: catalog_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - restorator-network

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: restorator-booking-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: booking_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
    networks:
      - restorator-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: restorator-notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - restorator-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: restorator-api-gateway
    ports:
      - "4000:4000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:4001
      CATALOG_SERVICE_URL: http://catalog-service:4002
      BOOKING_SERVICE_URL: http://booking-service:4003
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      booking-service:
        condition: service_started
    networks:
      - restorator-network

networks:
  restorator-network:
    driver: bridge

volumes:
  postgres_data:
