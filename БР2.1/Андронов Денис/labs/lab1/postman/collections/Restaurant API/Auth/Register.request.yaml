$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "first_name": "Ivan",
      "last_name": "Ivanov",
      "middle_name": "Ivanovich",
      "email": "ivan@example.com",
      "password": "secret123"
    }
