$kind: http-request
name: Create Review
method: POST
url: '{{baseUrl}}/reviews'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "restaurant_id": 1,
      "rating": 5,
      "comment": "Great place!"
    }
