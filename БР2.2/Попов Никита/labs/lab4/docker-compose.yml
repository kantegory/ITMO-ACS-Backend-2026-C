services:
  kafka:
    image: public.ecr.aws/bitnami/kafka:3.6
    ports:
      - "9092:9092"

    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      ALLOW_PLAINTEXT_LISTENER: "yes"

    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "15441:5432"

  kafdrop:
    image: obsidiandynamics/kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app
      - DB_PASSWORD=app
      - DB_SCHEMA=users
      - JWT_SECRET=secret
      - INTERNAL_API_KEY=internal-secret
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8081:8081"

  restaurant-service:
    build:
      context: ./services/restaurant-service
      dockerfile: Dockerfile
    environment:
      - PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app
      - DB_PASSWORD=app
      - DB_SCHEMA=restaurants
      - INTERNAL_API_KEY=internal-secret
      - REVIEWS_SERVICE_URL=http://reviews-service:8084
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    ports:
      - "8082:8082"

  bookings-service:
    build:
      context: ./services/bookings-service
      dockerfile: Dockerfile
    environment:
      - PORT=8083
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app
      - DB_PASSWORD=app
      - DB_SCHEMA=bookings
      - INTERNAL_API_KEY=internal-secret
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8082
      - USER_SERVICE_URL=http://users-service:8081
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      restaurant-service:
        condition: service_started
      users-service:
        condition: service_started
    ports:
      - "8083:8083"

  reviews-service:
    build:
      context: ./services/reviews-service
      dockerfile: Dockerfile
    environment:
      - PORT=8084
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=app_db
      - DB_USER=app
      - DB_PASSWORD=app
      - DB_SCHEMA=reviews
      - INTERNAL_API_KEY=internal-secret
      - RESTAURANT_SERVICE_URL=http://restaurant-service:8082
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
      restaurant-service:
        condition: service_started
    ports:
      - "8084:8084"

networks:
  default:
    name: lab4-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.1.0/24
