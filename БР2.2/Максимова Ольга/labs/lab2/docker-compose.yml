services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rent-net

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 | grep -q 'ApiVersion' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rent-net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      sh -c '
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic rent.events --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.events --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic accommodation.events --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.events --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic message.events --partitions 1 --replication-factor 1
      '
    restart: "no"
    networks:
      - rent-net

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres 
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    env_file: ./user/.env
    ports:
      - "8001:8001"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
    networks:
      - rent-net

  accommodation:
    build:
      context: .
      dockerfile: accommodation/Dockerfile
    env_file: ./accommodation/.env
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
    networks:
      - rent-net

  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    env_file: ./payment/.env
    ports:
      - "8003:8003"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
    networks:
      - rent-net

  rent:
    build:
      context: .
      dockerfile: rent/Dockerfile
    env_file: ./rent/.env
    ports:
      - "8002:8002"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
    networks:
      - rent-net

  message:
    build:
      context: .
      dockerfile: message/Dockerfile
    env_file: ./message/.env
    ports:
      - "8004:8004"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy 
    networks:
      - rent-net


volumes:
  postgres-data:

networks:
  rent-net:
    name: rent-network