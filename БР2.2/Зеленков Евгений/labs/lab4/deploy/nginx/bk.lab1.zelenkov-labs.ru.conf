server {
    listen 80;
    listen [::]:80;
    server_name bk.lab1.zelenkov-labs.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2;
    server_name bk.lab1.zelenkov-labs.ru;

    ssl_certificate /etc/letsencrypt/live/bk.lab1.zelenkov-labs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bk.lab1.zelenkov-labs.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
