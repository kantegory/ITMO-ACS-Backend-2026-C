services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-api-postgres
    environment:
      POSTGRES_DB: booking_api
      POSTGRES_USER: booking_api_user
      POSTGRES_PASSWORD: booking_api_password
    ports:
      - "5432:5432"
    volumes:
      - booking_api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_api_user -d booking_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking_api_pgdata:
