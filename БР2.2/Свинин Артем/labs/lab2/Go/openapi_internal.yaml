openapi: 3.0.0
info:
  title: Rental Platform - Internal Microservices API
  version: 1.0.0
  description: |
    ## Внутренний API для межсервисного взаимодействия
    
    ### Сервисы:
    - **Auth Service** (`/internal/auth/*`) - Валидация токенов и пользователей
    - **User Service** (`/internal/users/*`) - Данные пользователей
    - **Property Service** (`/internal/properties/*`) - Объекты недвижимости
    - **Booking Service** (`/internal/bookings/*`) - Бронирования
    - **Payment Service** (`/internal/payments/*`) - Транзакции
    - **Review Service** (`/internal/reviews/*`) - Отзывы и рейтинги
    - **Communication Service** (`/internal/chats/*`) - Чаты

    ### Аутентификация:
    Все запросы требуют Service Token в заголовке:
    ```
    X-Service-Token: <service_secret_token>
    ```

servers:
  - url: http://localhost:8080/internal

tags:
  - name: Auth Service Internal
    description: Валидация токенов и пользователей для других сервисов
  - name: User Service Internal
    description: Данные пользователей для межсервисного использования
  - name: Property Service Internal
    description: Объекты недвижимости, доступность, владельцы
  - name: Booking Service Internal
    description: Бронирования, статусы, доступность дат
  - name: Payment Service Internal
    description: Транзакции, статусы оплат, webhook
  - name: Review Service Internal
    description: Отзывы, рейтинги, проверка возможности отзыва
  - name: Communication Service Internal
    description: Чаты, сообщения, участники

paths:
  # ==================== AUTH SERVICE INTERNAL ====================
  /auth/tokens/validate:
    post:
      tags:
        - Auth Service Internal
      summary: Валидация JWT токена пользователя
      description: |
        Проверка валидности JWT токена для других сервисов.
        Используется API Gateway и сервисами для проверки авторизации запросов.
      operationId: validateUserToken
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenValidationRequest'
            examples:
              validToken:
                summary: Валидный токен
                value:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
              expiredToken:
                summary: Истекший токен
                value:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.expired"
      responses:
        '200':
          description: Токен валиден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
              examples:
                valid:
                  summary: Токен валиден
                  value:
                    valid: true
                    userId: 1
                    email: "user@example.com"
                    role: "USER"
                    expiresAt: "2024-12-31T23:59:59Z"
                    isActive: true
                expired:
                  summary: Токен истек
                  value:
                    valid: false
                    reason: "Token expired"
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
              examples:
                missingToken:
                  summary: Токен не предоставлен
                  value:
                    code: 400
                    message: "Токен обязателен"
                    details:
                      - field: "token"
                        error: "required"
        '401':
          description: Неавторизован (невалидный service token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '503':
          description: Сервис аутентификации недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /auth/users/{id}:
    get:
      tags:
        - Auth Service Internal
      summary: Получить данные пользователя по ID
      description: |
        Возвращает базовые данные пользователя для других сервисов.
        Используется когда сервису нужно получить информацию о пользователе по ID.
      operationId: getUserById
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            format: int32
          examples:
            validId:
              summary: Существующий пользователь
              value: 1
            invalidId:
              summary: Не существует
              value: 99999
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserResponse'
              examples:
                userFound:
                  summary: Пользователь найден
                  value:
                    id: 1
                    email: "user@example.com"
                    firstName: "Иван"
                    lastName: "Иванов"
                    role: "USER"
                    isActive: true
                    isVerified: true
                    createdAt: "2024-01-15T10:30:00Z"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
              examples:
                notFound:
                  summary: Пользователь не найден
                  value:
                    code: 404
                    message: "Пользователь не найден"
                    details:
                      - field: "id"
                        error: "user does not exist"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /auth/users/validate:
    post:
      tags:
        - Auth Service Internal
      summary: Массовая валидация пользователей
      description: |
        Проверка существования и статуса нескольких пользователей одновременно.
        Используется для оптимизации запросов при работе со списками.
      operationId: validateUsersBatch
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: integer
                    format: int32
                  minItems: 1
                  maxItems: 100
              required:
                - userIds
            examples:
              batchValidation:
                summary: Валидация нескольких пользователей
                value:
                  userIds: [1, 2, 3, 4, 5]
      responses:
        '200':
          description: Результат валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: integer
                        isActive:
                          type: boolean
                  invalid:
                    type: array
                    items:
                      type: integer
              examples:
                validationResult:
                  summary: Результат валидации
                  value:
                    valid:
                      - userId: 1
                        isActive: true
                      - userId: 2
                        isActive: true
                      - userId: 3
                        isActive: false
                    invalid:
                      - 4
                      - 5
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  # ==================== USER SERVICE INTERNAL ====================
  /users/{id}/profile:
    get:
      tags:
        - User Service Internal
      summary: Получить профиль пользователя
      description: |
        Возвращает расширенный профиль пользователя для других сервисов.
        Включает дополнительную информацию не доступную в Auth Service.
      operationId: getUserProfile
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalUserProfile'
              examples:
                profile:
                  summary: Профиль пользователя
                  value:
                    id: 1
                    email: "user@example.com"
                    firstName: "Иван"
                    lastName: "Иванов"
                    middleName: "Иванович"
                    phone: "+79991234567"
                    role: "USER"
                    isVerified: true
                    isActive: true
                    propertiesCount: 5
                    bookingsCount: 12
                    averageRating: 4.8
                    totalReviews: 25
                    createdAt: "2024-01-15T10:30:00Z"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /users/{id}/properties:
    get:
      tags:
        - User Service Internal
      summary: Получить объекты пользователя
      description: |
        Возвращает список ID объектов недвижимости, принадлежащих пользователю.
        Используется для проверки прав доступа.
      operationId: getUserProperties
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Максимальное количество записей
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Список объектов
          content:
            application/json:
              schema:
                type: object
                properties:
                  propertyIds:
                    type: array
                    items:
                      type: integer
                      format: int32
                  total:
                    type: integer
                    format: int32
              examples:
                properties:
                  summary: Объекты пользователя
                  value:
                    propertyIds: [10, 15, 20, 25, 30]
                    total: 5
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /users/validate-ownership:
    post:
      tags:
        - User Service Internal
      summary: Проверка права владения
      description: |
        Проверяет, принадлежит ли объект недвижимости пользователю.
        Используется для авторизации операций с объектами.
      operationId: validateOwnership
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                  format: int32
                propertyId:
                  type: integer
                  format: int32
              required:
                - userId
                - propertyId
            examples:
              ownershipCheck:
                summary: Проверка владения
                value:
                  userId: 1
                  propertyId: 10
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOwner:
                    type: boolean
                  propertyId:
                    type: integer
                  userId:
                    type: integer
              examples:
                isOwner:
                  summary: Пользователь владелец
                  value:
                    isOwner: true
                    propertyId: 10
                    userId: 1
                notOwner:
                  summary: Пользователь не владелец
                  value:
                    isOwner: false
                    propertyId: 10
                    userId: 2
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  # ==================== PROPERTY SERVICE INTERNAL ====================
  /properties/{id}:
    get:
      tags:
        - Property Service Internal
      summary: Получить данные объекта
      description: |
        Возвращает базовые данные объекта недвижимости для других сервисов.
        Включает только необходимые поля для межсервисного взаимодействия.
      operationId: getPropertyById
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID объекта недвижимости
          schema:
            type: integer
            format: int32
        - name: include
          in: query
          description: Дополнительные данные для включения
          schema:
            type: array
            items:
              type: string
              enum: [address, owner, images, facilities]
          style: form
          explode: false
      responses:
        '200':
          description: Данные объекта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalProperty'
              examples:
                propertyBasic:
                  summary: Базовые данные
                  value:
                    id: 10
                    ownerId: 1
                    typeId: 1
                    title: "Уютная квартира в центре"
                    pricePerDay: 5000
                    pricePerMonth: 120000
                    isAvailable: true
                    maxGuests: 3
                    bedrooms: 1
                    bathrooms: 1
                propertyFull:
                  summary: Полные данные
                  value:
                    id: 10
                    ownerId: 1
                    typeId: 1
                    title: "Уютная квартира в центре"
                    pricePerDay: 5000
                    pricePerMonth: 120000
                    isAvailable: true
                    maxGuests: 3
                    bedrooms: 1
                    bathrooms: 1
                    address:
                      id: 5
                      city: "Москва"
                      district: "Центральный"
                      fullAddress: "Москва, Центральный р-н, ул. Примерная, д. 10"
                    owner:
                      id: 1
                      firstName: "Иван"
                      lastName: "Иванов"
                      email: "owner@example.com"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
              examples:
                notFound:
                  summary: Объект не найден
                  value:
                    code: 404
                    message: "Объект недвижимости не найден"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /properties/{id}/availability:
    get:
      tags:
        - Property Service Internal
      summary: Проверить доступность объекта
      description: |
        Проверяет доступность объекта в указанные даты.
        Критически важный эндпоинт для Booking Service при создании бронирования.
      operationId: checkPropertyAvailability
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID объекта недвижимости
          schema:
            type: integer
            format: int32
        - name: startDate
          in: query
          required: true
          description: Дата начала
          schema:
            type: string
            format: date-time
          examples:
            startDate:
              value: "2024-02-01T14:00:00Z"
        - name: endDate
          in: query
          required: true
          description: Дата окончания
          schema:
            type: string
            format: date-time
          examples:
            endDate:
              value: "2024-02-05T12:00:00Z"
      responses:
        '200':
          description: Результат проверки доступности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              examples:
                available:
                  summary: Объект доступен
                  value:
                    available: true
                    propertyId: 10
                    startDate: "2024-02-01T14:00:00Z"
                    endDate: "2024-02-05T12:00:00Z"
                    pricePerDay: 5000
                    totalPrice: 20000
                    minRentDays: 1
                    maxRentDays: 30
                notAvailable:
                  summary: Объект недоступен
                  value:
                    available: false
                    propertyId: 10
                    startDate: "2024-02-01T14:00:00Z"
                    endDate: "2024-02-05T12:00:00Z"
                    reason: "PROPERTY_NOT_AVAILABLE"
                    message: "Объект временно недоступен"
                dateConflict:
                  summary: Даты заняты
                  value:
                    available: false
                    propertyId: 10
                    startDate: "2024-02-01T14:00:00Z"
                    endDate: "2024-02-05T12:00:00Z"
                    reason: "DATE_CONFLICT"
                    message: "Объект забронирован на выбранные даты"
                    conflictingBookings:
                      - bookingId: 100
                        startDate: "2024-01-28T14:00:00Z"
                        endDate: "2024-02-03T12:00:00Z"
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
              examples:
                invalidDates:
                  summary: Некорректные даты
                  value:
                    code: 400
                    message: "Дата окончания должна быть позже даты начала"
                    details:
                      - field: "endDate"
                        error: "must be after startDate"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /properties/{id}/owner:
    get:
      tags:
        - Property Service Internal
      summary: Получить владельца объекта
      description: |
        Возвращает данные владельца объекта недвижимости.
        Используется Communication Service для создания чата.
      operationId: getPropertyOwner
      security:
        - ServiceTokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID объекта недвижимости
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Данные владельца
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerId:
                    type: integer
                    format: int32
                  ownerEmail:
                    type: string
                  ownerFirstName:
                    type: string
                  ownerLastName:
                    type: string
                  ownerPhone:
                    type: string
                  isVerified:
                    type: boolean
              examples:
                ownerData:
                  summary: Данные владельца
                  value:
                    ownerId: 1
                    ownerEmail: "owner@example.com"
                    ownerFirstName: "Иван"
                    ownerLastName: "Иванов"
                    ownerPhone: "+79991234567"
                    isVerified: true
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /properties/validate:
    post:
      tags:
        - Property Service Internal
      summary: Массовая валидация объектов
      description: |
        Проверка существования и статуса нескольких объектов одновременно.
        Используется для оптимизации запросов.
      operationId: validatePropertiesBatch
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyIds:
                  type: array
                  items:
                    type: integer
                    format: int32
                  minItems: 1
                  maxItems: 100
              required:
                - propertyIds
            examples:
              batchValidation:
                summary: Валидация нескольких объектов
                value:
                  propertyIds: [10, 15, 20, 25, 30]
      responses:
        '200':
          description: Результат валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: array
                    items:
                      type: object
                      properties:
                        propertyId:
                          type: integer
                        isAvailable:
                          type: boolean
                        ownerId:
                          type: integer
                  invalid:
                    type: array
                    items:
                      type: integer
              examples:
                validationResult:
                  summary: Результат валидации
                  value:
                    valid:
                      - propertyId: 10
                        isAvailable: true
                        ownerId: 1
                      - propertyId: 15
                        isAvailable: true
                        ownerId: 2
                      - propertyId: 20
                        isAvailable: false
                        ownerId: 1
                    invalid:
                      - 25
                      - 30
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

  /properties/by-owner/{ownerId}:
    get:
      tags:
        - Property Service Internal
      summary: Получить объекты владельца
      description: |
