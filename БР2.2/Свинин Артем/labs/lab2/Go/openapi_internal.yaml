                  type: string
                  enum: [PENDING, SUCCESS, FAILED, REFUNDED]
                paymentGatewayResponse:
                  type: object
                  properties:
                    gatewayTransactionId:
                      type: string
                    errorCode:
                      type: string
                    errorMessage:
                      type: string
              required:
