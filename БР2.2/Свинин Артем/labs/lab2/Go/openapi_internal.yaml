          content:
            application/json:
              schema:
                type: object
                properties:
                  chatId:
                    type: integer
                    format: int32
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: integer
                          format: int32
                        role:
                          type: string
                          enum: [OWNER, OCCUPIER]
                        joinedAt:
                          type: string
                          format: date-time
