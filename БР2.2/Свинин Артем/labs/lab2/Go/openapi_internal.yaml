                    gatewayTransactionId: "gw_txn_abc123"
              markFailed:
                summary: Оплата не удалась
                value:
                  status: "FAILED"
                  paymentGatewayResponse:
                    errorCode: "INSUFFICIENT_FUNDS"
                    errorMessage: "Недостаточно средств на карте"
