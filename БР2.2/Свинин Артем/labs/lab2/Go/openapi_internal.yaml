  /chats/validate-participant:
    post:
      tags:
        - Communication Service Internal
      summary: Проверить участника чата
      description: |
        Проверяет, является ли пользователь участником чата.
        Используется для авторизации отправки сообщений.
      operationId: validateChatParticipant
      security:
        - ServiceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chatId:
                  type: integer
                  format: int32
                userId:
                  type: integer
                  format: int32
              required:
                - chatId
                - userId
            examples:
              participantCheck:
                summary: Проверка участника
                value:
                  chatId: 10
                  userId: 2
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  isParticipant:
                    type: boolean
                  role:
                    type: string
                    enum: [OWNER, OCCUPIER]
              examples:
                isParticipant:
                  summary: Пользователь участник
                  value:
                    isParticipant: true
                    role: "OCCUPIER"
                notParticipant:
                  summary: Пользователь не участник
                  value:
                    isParticipant: false
                    role: null
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Чат не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'

components:
  securitySchemes:
    ServiceTokenAuth:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        Service-to-Service аутентификация.
        
        Каждый сервис имеет свой секретный токен для внутренних вызовов.
        Токены должны храниться в secure vault (HashiCorp Vault, AWS Secrets Manager).
        
        Пример:
        ```
        X-Service-Token: svc_booking_service_abc123xyz789
        ```

  schemas:
    # === Common Error ===
    InternalApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP код ошибки
          example: 400
        message:
          type: string
          description: Сообщение об ошибке
          example: "Некорректный запрос"
        details:
          type: array
          description: Детали ошибки валидации
          items:
            type: object
            properties:
              field:
                type: string
                description: Поле с ошибкой
              error:
                type: string
                description: Описание ошибки
        traceId:
          type: string
          description: ID трассировки для отладки
          example: "trace_abc123"
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
        service:
          type: string
          description: Имя сервиса, вернувшего ошибку
          example: "property-service"

    # === Auth Schemas ===
    TokenValidationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT токен пользователя для валидации
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenValidationResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Валиден ли токен
        userId:
          type: integer
          format: int32
          description: ID пользователя (если валиден)
        email:
          type: string
          description: Email пользователя
        role:
          type: string
          enum: [ADMIN, USER]
        expiresAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        reason:
          type: string
          description: Причина невалидности (если valid=false)

    InternalUserResponse:
      type: object
      required:
        - id
        - email
        - role
        - isActive
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [ADMIN, USER]
        isActive:
          type: boolean
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    InternalUserProfile:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        phone:
          type: string
        role:
          type: string
        isVerified:
          type: boolean
        isActive:
          type: boolean
        propertiesCount:
          type: integer
          format: int32
        bookingsCount:
          type: integer
          format: int32
        averageRating:
          type: number
          format: decimal
        totalReviews:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time

    # === Property Schemas ===
    InternalProperty:
      type: object
      required:
        - id
        - ownerId
        - title
        - pricePerDay
        - isAvailable
      properties:
        id:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        typeId:
          type: integer
          format: int32
        title:
          type: string
        pricePerDay:
          type: number
          format: decimal
        pricePerMonth:
          type: number
          format: decimal
        isAvailable:
          type: boolean
        maxGuests:
          type: integer
          format: int32
        bedrooms:
          type: integer
          format: int32
        bathrooms:
          type: integer
          format: int32
        address:
          type: object
          properties:
            id:
              type: integer
            city:
              type: string
            district:
              type: string
            fullAddress:
              type: string
        owner:
          type: object
          properties:
            id:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
        images:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              imageUrl:
                type: string
              isMain:
                type: boolean
        facilities:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string

    AvailabilityResponse:
      type: object
      required:
        - available
        - propertyId
      properties:
        available:
          type: boolean
        propertyId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        reason:
          type: string
          enum: [PROPERTY_NOT_AVAILABLE, DATE_CONFLICT, MIN_RENT_DAYS, MAX_RENT_DAYS]
        message:
          type: string
        pricePerDay:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal
        minRentDays:
          type: integer
          format: int32
        maxRentDays:
          type: integer
          format: int32
        conflictingBookings:
          type: array
          items:
            type: object
            properties:
              bookingId:
                type: integer
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time

    # === Booking Schemas ===
    InternalBooking:
      type: object
      required:
        - id
        - propertyId
        - occupierId
        - status
        - startDate
        - endDate
        - totalPrice
      properties:
        id:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        occupierId:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, ACTIVE, COMPLETED, CANCELLED, REJECTED]
        totalPrice:
          type: number
          format: decimal
        guestsCount:
          type: integer
          format: int32
        specialRequest:
          type: string
        cancellationReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        property:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            address:
              type: object
              properties:
                city:
                  type: string
        occupier:
          type: object
          properties:
            id:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
        owner:
          type: object
          properties:
            id:
              type: integer
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string

    BookingStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, ACTIVE, COMPLETED, CANCELLED, REJECTED]
        paymentId:
          type: string
          description: ID платежа (для перехода в CONFIRMED)
        cancellationReason:
          type: string
          maxLength: 1000
        updatedBy:
          type: string
          description: Сервис, обновивший статус
          enum: [PAYMENT_SERVICE, BOOKING_SERVICE, ADMIN]

    # === Payment Schemas ===
    InternalTransaction:
      type: object
      required:
        - id
        - bookingId
        - status
        - amount
        - currency
      properties:
        id:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        paymentMethod:
          type: string
          enum: [CARD, BANK_TRANSFER, ELECTRONIC_WALLET, CASH]
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
        transactionDate:
          type: string
          format: date-time
        paymentId:
          type: string
          description: ID в платежном шлюзе
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: number
          format: decimal
        feeAmount:
          type: number
          format: decimal
        refundedAmount:
          type: number
          format: decimal

    # === Communication Schemas ===
    InternalChat:
      type: object
      required:
        - id
        - ownerId
        - occupierId
        - propertyId
      properties:
        id:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        occupierId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        lastMessage:
          type: object
          properties:
            id:
              type: integer
            content:
              type: string
            sentAt:
              type: string
              format: date-time
        unreadCount:
          type: integer
          format: int32

security:
  - ServiceTokenAuth: []