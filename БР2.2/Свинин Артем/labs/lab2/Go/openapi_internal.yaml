                  summary: Участники чата
                  value:
                    chatId: 10
                    participants:
                      - userId: 1
                        role: "OWNER"
                        joinedAt: "2024-01-15T10:30:00Z"
                      - userId: 2
                        role: "OCCUPIER"
                        joinedAt: "2024-01-15T10:30:00Z"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalApiError'
        '404':
          description: Чат не найден
          content:
