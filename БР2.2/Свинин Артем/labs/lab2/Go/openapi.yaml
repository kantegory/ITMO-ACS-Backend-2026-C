      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: query
          required: true
          description: ID чата
          schema:
            type: integer
            format: int32
        - $ref: '#/components/parameters/PaginationParams.page'
        - $ref: '#/components/parameters/PaginationParams.pageSize'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseMessage'
              examples:
                messagesList:
                  summary: Список сообщений
                  value:
                    items:
                      - id: 200
                        chatId: 10
                        senderId: 1
                        content: "Здравствуйте!"
                        sentAt: "2024-01-15T10:30:00Z"
                        isRead: true
                        readAt: "2024-01-15T10:35:00Z"
                        sender:
                          id: 1
                          firstName: "Иван"
                          lastName: "Иванов"
                      - id: 201
                        chatId: 10
                        senderId: 2
                        content: "Добрый день! Заезд с 14:00"
                        sentAt: "2024-01-15T10:35:00Z"
                        isRead: false
                    total: 50
                    page: 1
                    pageSize: 20
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Чат не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /messages/{id}:
    patch:
      tags:
        - Communication Service
      summary: Пометить сообщение как прочитанное
      description: Обновление статуса прочтения сообщения
      operationId: markMessageAsRead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID сообщения
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Статус успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Сообщение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  parameters:
    PaginationParams.page:
      name: page
      in: query
      description: Номер страницы (начиная с 1)
      required: false
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
      example: 1
    PaginationParams.pageSize:
      name: pageSize
      in: query
      description: Количество элементов на странице
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1
        maximum: 100
      example: 10

  schemas:
    # === Common ===
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Код ошибки HTTP
          example: 400
        message:
          type: string
          description: Сообщение об ошибке
          example: "Некорректный запрос"
        details:
          type: array
          description: Детали ошибки валидации
          items:
            type: object
            properties:
              field:
                type: string
                description: Поле с ошибкой
              error:
                type: string
                description: Описание ошибки
        traceId:
          type: string
          description: ID трассировки для отладки
          example: "abc123-def456"
        retryAfter:
          type: integer
          description: Секунды до повторной попытки (для 503)
          example: 60

    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: JWT access токен
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: Refresh токен для обновления access токена
          example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
        expiresIn:
          type: integer
          description: Время жизни access токена в секундах
          example: 3600

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email пользователя
          example: "user@example.com"
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: "SecurePass123"

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя
          example: "Иван"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Фамилия
          example: "Иванов"
        email:
          type: string
          format: email
          description: Email
          example: "ivan@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Пароль (минимум 8 символов)
          example: "SecurePass123"

    # === User ===
    UserResponse:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - role
        - isVerified
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
          example: 1
        firstName:
          type: string
          example: "Иван"
        lastName:
          type: string
          example: "Иванов"
        middleName:
          type: string
          example: "Иванович"
        email:
          type: string
          format: email
          example: "ivan@example.com"
        phone:
          type: string
          example: "+79991234567"
        role:
          type: string
          enum:
            - ADMIN
            - USER
          example: "USER"
        isVerified:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string

    Favourite:
      type: object
      required:
        - id
        - userId
        - propertyId
        - addedAt
      properties:
        id:
          type: integer
          format: int32
        userId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        addedAt:
          type: string
          format: date-time
        property:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            pricePerDay:
              type: number
            images:
              type: array
              items:
                $ref: '#/components/schemas/Image'

    # === Property ===
    Property:
      type: object
      required:
        - id
        - ownerId
        - addressId
        - title
        - description
        - pricePerDay
        - pricePerMonth
        - areaSqM
        - maxGuests
        - bedrooms
        - bathrooms
        - isAvailable
        - minRentDays
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        typeId:
          type: integer
          format: int32
        owner:
          $ref: '#/components/schemas/UserResponse'
        type:
          $ref: '#/components/schemas/PropertyType'
        addressId:
          type: integer
          format: int32
        address:
          $ref: '#/components/schemas/Address'
        title:
          type: string
          maxLength: 255
        description:
          type: string
        pricePerDay:
          type: number
          format: decimal
          minimum: 0
        pricePerMonth:
          type: number
          format: decimal
          minimum: 0
        areaSqM:
          type: integer
          format: int32
          minimum: 1
        maxGuests:
          type: integer
          format: int32
          minimum: 1
        bedrooms:
          type: integer
          format: int32
          minimum: 0
        bathrooms:
          type: integer
          format: int32
          minimum: 0
        isAvailable:
          type: boolean
        minRentDays:
          type: integer
          format: int32
          minimum: 1
        maxRentDays:
          type: integer
          format: int32
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/Facility'
        rating:
          type: object
          properties:
            average:
              type: number
              format: decimal
            totalReviews:
              type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PropertyCreateRequest:
      type: object
      required:
        - addressId
        - title
        - description
        - pricePerDay
        - pricePerMonth
        - areaSqM
        - maxGuests
        - bedrooms
        - bathrooms
        - minRentDays
      properties:
        typeId:
          type: integer
          format: int32
        addressId:
          type: integer
          format: int32
        title:
          type: string
          minLength: 5
          maxLength: 255
        description:
          type: string
          minLength: 20
          maxLength: 5000
        pricePerDay:
          type: number
          format: decimal
          minimum: 0
        pricePerMonth:
          type: number
          format: decimal
          minimum: 0
        areaSqM:
          type: integer
          format: int32
          minimum: 1
        maxGuests:
          type: integer
          format: int32
          minimum: 1
        bedrooms:
          type: integer
          format: int32
          minimum: 0
        bathrooms:
          type: integer
          format: int32
          minimum: 0
        isAvailable:
          type: boolean
          default: true
        minRentDays:
          type: integer
          format: int32
          minimum: 1
        maxRentDays:
          type: integer
          format: int32

    PropertyUpdateRequest:
      type: object
      properties:
        typeId:
          type: integer
          format: int32
        addressId:
          type: integer
          format: int32
        title:
          type: string
          minLength: 5
          maxLength: 255
        description:
          type: string
          minLength: 20
          maxLength: 5000
        pricePerDay:
          type: number
          format: decimal
          minimum: 0
        pricePerMonth:
          type: number
          format: decimal
          minimum: 0
        areaSqM:
          type: integer
          format: int32
          minimum: 1
        maxGuests:
          type: integer
          format: int32
          minimum: 1
        bedrooms:
          type: integer
          format: int32
          minimum: 0
        bathrooms:
          type: integer
          format: int32
          minimum: 0
        isAvailable:
          type: boolean
        minRentDays:
          type: integer
          format: int32
          minimum: 1
        maxRentDays:
          type: integer
          format: int32

    Address:
      type: object
      required:
        - id
        - country
        - city
        - houseNumber
      properties:
        id:
          type: integer
          format: int32
        country:
          type: string
        city:
          type: string
        district:
          type: string
        houseNumber:
          type: string
        apartment:
          type: string
        postalCode:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        fullAddress:
          type: string

    AddressCreateRequest:
      type: object
      required:
        - country
        - city
        - houseNumber
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 100
        city:
          type: string
          minLength: 2
          maxLength: 100
        district:
          type: string
          maxLength: 100
        houseNumber:
          type: string
          minLength: 1
          maxLength: 20
        apartment:
          type: string
          maxLength: 20
        postalCode:
          type: string
          maxLength: 20
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Facility:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: integer
          format: int32
        type:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Image:
      type: object
      required:
        - id
        - propertyId
        - imageUrl
        - isMain
      properties:
        id:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        imageUrl:
          type: string
          format: uri
        isMain:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PropertyType:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string

    # === Booking ===
    Booking:
      type: object
      required:
        - id
        - propertyId
        - occupierId
        - startDate
        - endDate
        - totalPrice
        - status
        - guestsCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        occupierId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        totalPrice:
          type: number
          format: decimal
          minimum: 0
        status:
          $ref: '#/components/schemas/BookingStatus'
        guestsCount:
          type: integer
          format: int32
          minimum: 1
        specialRequest:
          type: string
          maxLength: 1000
        cancellationReason:
          type: string
          maxLength: 1000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        property:
          $ref: '#/components/schemas/BookingPropertySummary'
        occupier:
          $ref: '#/components/schemas/UserResponse'

    BookingPropertySummary:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        address:
          $ref: '#/components/schemas/BookingPropertyAddressSummary'

    BookingPropertyAddressSummary:
      type: object
      properties:
        city:
          type: string

    BookingCreateRequest:
      type: object
      required:
        - propertyId
        - startDate
        - endDate
        - guestsCount
      properties:
        propertyId:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        guestsCount:
          type: integer
          format: int32
          minimum: 1
        specialRequest:
          type: string
          maxLength: 1000

    BookingStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - ACTIVE
        - COMPLETED
        - CANCELLED
        - REJECTED
      description: |
        Статусы бронирования:
        - **PENDING** - Ожидает подтверждения
        - **CONFIRMED** - Подтверждено
        - **ACTIVE** - Активно (гость заселился)
        - **COMPLETED** - Завершено
        - **CANCELLED** - Отменено
        - **REJECTED** - Отклонено владельцем

    # === Payment ===
    Transaction:
      type: object
      required:
        - id
        - bookingId
        - paymentMethod
        - status
        - transactionDate
        - paymentId
        - currency
        - amount
        - feeAmount
      properties:
        id:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        paymentMethod:
          type: string
          enum:
            - CARD
            - BANK_TRANSFER
            - ELECTRONIC_WALLET
            - CASH
        status:
          $ref: '#/components/schemas/TransactionStatus'
        transactionDate:
          type: string
          format: date-time
        paymentId:
          type: string
          description: ID транзакции в платежном шлюзе
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Код валюты ISO 4217
        amount:
          type: number
          format: decimal
          minimum: 0
        feeAmount:
          type: number
          format: decimal
          minimum: 0
        refundedAmount:
          type: number
          format: decimal
        booking:
          $ref: '#/components/schemas/Booking'

    TransactionCreateRequest:
      type: object
      required:
        - bookingId
        - paymentMethod
        - currency
        - amount
      properties:
        bookingId:
          type: integer
          format: int32
        paymentMethod:
          type: string
          enum:
            - CARD
            - BANK_TRANSFER
            - ELECTRONIC_WALLET
            - CASH
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: number
          format: decimal
          minimum: 0.01

    TransactionStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
        - REFUNDED
      description: |
        Статусы транзакции:
        - **PENDING** - В обработке
        - **SUCCESS** - Успешно
        - **FAILED** - Не удалось
        - **REFUNDED** - Возвращено

    # === Review ===
    Review:
      type: object
      required:
        - id
        - bookingId
        - reviewerId
        - targetType
        - rating
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        reviewerId:
          type: integer
          format: int32
        targetType:
          $ref: '#/components/schemas/ReviewTargetType'
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        responseText:
          type: string
          maxLength: 2000
        responseDate:
          type: string
          format: date-time
        booking:
          $ref: '#/components/schemas/Booking'
        property:
          $ref: '#/components/schemas/Property'
        reviewer:
          $ref: '#/components/schemas/UserResponse'

    ReviewCreateRequest:
      type: object
      required:
        - bookingId
        - targetType
        - rating
      properties:
        bookingId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        targetType:
          $ref: '#/components/schemas/ReviewTargetType'
        rating:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 10
          maxLength: 2000

    ReviewTargetType:
      type: string
      enum:
        - PROPERTY
        - OWNER
        - OCCUPIER
      description: |
        Тип цели отзыва:
        - **PROPERTY** - Отзыв об объекте
        - **OWNER** - Отзыв о владельце
        - **OCCUPIER** - Отзыв о госте

    # === Communication ===
    Chat:
      type: object
      required:
        - id
        - ownerId
        - occupierId
        - propertyId
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        ownerId:
          type: integer
          format: int32
        occupierId:
          type: integer
          format: int32
        propertyId:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        owner:
          $ref: '#/components/schemas/UserResponse'
        occupier:
          $ref: '#/components/schemas/UserResponse'
        property:
          $ref: '#/components/schemas/Property'
        booking:
          $ref: '#/components/schemas/Booking'
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
          format: int32

    Message:
      type: object
      required:
        - id
        - chatId
        - senderId
        - content
        - sentAt
        - isRead
      properties:
        id:
          type: integer
          format: int32
        chatId:
          type: integer
          format: int32
        senderId:
          type: integer
          format: int32
        content:
          type: string
          minLength: 1
          maxLength: 5000
        sentAt:
          type: string
          format: date-time
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
        chat:
          $ref: '#/components/schemas/Chat'
        sender:
          $ref: '#/components/schemas/UserResponse'

    # === Paginated Responses ===
    PaginatedResponseFavourite:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Favourite'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    PaginatedResponseProperty:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    PaginatedResponseBooking:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    PaginatedResponseTransaction:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32

    PaginatedResponseReview:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
