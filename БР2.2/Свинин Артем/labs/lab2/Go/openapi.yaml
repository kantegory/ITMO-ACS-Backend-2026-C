# swagger-gateway.yaml
openapi: 3.0.0
info:
  title: Rental Platform - API Gateway
  version: 1.0.0

servers:
  - url: https://api.rental-platform.com/v1
    description: Production
  - url: https://staging-api.rental-platform.com/v1
    description: Staging
  - url: http://localhost:8080/v1
    description: Local Development

tags:
  - name: Auth Service
    description: Аутентификация и управление сессиями
  - name: User Service
    description: Профили пользователей и избранное
  - name: Property Service
    description: Объекты недвижимости, адреса, фото
  - name: Booking Service
    description: Бронирования и доступность
  - name: Payment Service
    description: Платежи и транзакции
  - name: Review Service
    description: Отзывы и рейтинги
  - name: Communication Service
    description: Чаты и сообщения

paths:
  # ==================== AUTH SERVICE ====================
  /auth/login:
    post:
      tags:
        - Auth Service
      summary: Вход в систему
      description: Аутентификация пользователя и получение JWT токенов
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              validLogin:
                summary: Корректный вход
                value:
                  email: "user@example.com"
                  password: "SecurePass123"
              invalidEmail:
                summary: Неверный email
                value:
                  email: "invalid"
                  password: "SecurePass123"
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              examples:
                success:
                  summary: Успешный ответ
                  value:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                    expiresIn: 3600
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingField:
                  summary: Отсутствует поле
                  value:
                    code: 400
                    message: "Поле 'email' обязательно"
                    details:
                      - field: "email"
                        error: "required"
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidCredentials:
                  summary: Неверный логин или пароль
                  value:
                    code: 401
                    message: "Неверный email или пароль"
        '429':
          description: Слишком много попыток входа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                rateLimited:
                  summary: Превышен лимит попыток
                  value:
                    code: 429
                    message: "Слишком много попыток входа. Попробуйте через 15 минут"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                serverError:
                  summary: Ошибка сервера
                  value:
                    code: 500
                    message: "Внутренняя ошибка сервера"
                    traceId: "abc123-def456"

  /auth/register:
    post:
      tags:
        - Auth Service
      summary: Регистрация нового пользователя
      description: Создание нового аккаунта пользователя
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              validRegistration:
                summary: Корректная регистрация
                value:
                  firstName: "Иван"
                  lastName: "Иванов"
                  email: "ivan@example.com"
                  password: "SecurePass123"
              weakPassword:
                summary: Слабый пароль
                value:
                  firstName: "Иван"
                  lastName: "Иванов"
                  email: "ivan@example.com"
                  password: "123"
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Некорректные данные регистрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                weakPassword:
                  summary: Слабый пароль
                  value:
                    code: 400
                    message: "Пароль должен содержать минимум 8 символов"
                    details:
                      - field: "password"
                        error: "minLength"
                invalidEmail:
                  summary: Неверный email
                  value:
                    code: 400
                    message: "Некорректный формат email"
                    details:
                      - field: "email"
                        error: "format"
        '409':
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicateEmail:
                  summary: Email уже занят
                  value:
                    code: 409
                    message: "Пользователь с таким email уже существует"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags:
        - Auth Service
      summary: Выход из системы
      description: Инвалидация refresh токена
      operationId: authLogout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh токен для инвалидации
              required:
                - refreshToken
      responses:
        '204':
          description: Успешный выход
        '400':
          description: Неверный refresh токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/refresh:
    post:
      tags:
        - Auth Service
      summary: Обновление access токена
      description: Получение новой пары токенов по refresh токену
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
                - refreshToken
      responses:
        '200':
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Refresh токен истек или недействителен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ==================== USER SERVICE ====================
  /users/me:
    get:
      tags:
        - User Service
      summary: Получить профиль текущего пользователя
      description: Возвращает данные профиля авторизованного пользователя
      operationId: getUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                userProfile:
                  summary: Профиль пользователя
                  value:
                    id: 1
                    firstName: "Иван"
                    lastName: "Иванов"
                    middleName: "Иванович"
                    email: "ivan@example.com"
                    phone: "+79991234567"
                    role: "USER"
                    isVerified: true
                    isActive: true
                    createdAt: "2024-01-15T10:30:00Z"
                    updatedAt: "2024-01-15T10:30:00Z"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                unauthorized:
                  summary: Токен отсутствует или истек
                  value:
                    code: 401
                    message: "Требуется аутентификация"
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    patch:
      tags:
        - User Service
      summary: Обновить профиль текущего пользователя
      description: Обновление данных профиля авторизованного пользователя
      operationId: updateUserProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            examples:
              updateName:
                summary: Обновление имени
                value:
                  firstName: "Иван"
                  lastName: "Петров"
              updateEmail:
                summary: Обновление email
                value:
                  email: "new.email@example.com"
              updatePhone:
                summary: Обновление телефона
                value:
                  phone: "+79997654321"
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidEmail:
                  summary: Неверный формат email
                  value:
                    code: 400
                    message: "Некорректный формат email"
                    details:
                      - field: "email"
                        error: "format"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email уже занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{id}:
    get:
      tags:
        - User Service
      summary: Получить профиль пользователя по ID
      description: Возвращает данные профиля пользователя по идентификатору
      operationId: getUserById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            format: int32
          examples:
            validId:
              summary: Корректный ID
              value: 1
            invalidId:
              summary: Не существует
              value: 99999
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                forbidden:
                  summary: Недостаточно прав
                  value:
                    code: 403
                    message: "Доступ к профилю другого пользователя запрещен"
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                notFound:
                  summary: Пользователь не найден
                  value:
                    code: 404
                    message: "Пользователь не найден"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /favourites:
    get:
      tags:
        - User Service
      summary: Получить список избранного
      description: Возвращает список объектов в избранном текущего пользователя
      operationId: getFavourites
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaginationParams.page'
        - $ref: '#/components/parameters/PaginationParams.pageSize'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseFavourite'
              examples:
                favouritesList:
                  summary: Список избранного
                  value:
                    items:
                      - id: 1
                        userId: 1
                        propertyId: 10
                        addedAt: "2024-01-15T10:30:00Z"
                        property:
                          id: 10
                          title: "Уютная квартира в центре"
                          pricePerDay: 5000
                      - id: 2
                        userId: 1
                        propertyId: 15
                        addedAt: "2024-01-16T14:20:00Z"
                        property:
                          id: 15
                          title: "Дом у моря"
                          pricePerDay: 12000
                    total: 2
                    page: 1
                    pageSize: 10
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags:
        - User Service
      summary: Добавить объект в избранное
      description: Добавляет объект недвижимости в избранное текущего пользователя
      operationId: addFavourite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyId:
                  type: integer
                  format: int32
                  description: ID объекта недвижимости
              required:
                - propertyId
            examples:
              validProperty:
                summary: Корректный ID объекта
                value:
                  propertyId: 10
              invalidProperty:
                summary: Объект не существует
                value:
                  propertyId: 99999
      responses:
        '201':
          description: Объект добавлен в избранное
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favourite'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Объект уже в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicate:
                  summary: Уже в избранном
                  value:
                    code: 409
                    message: "Объект уже находится в избранном"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /favourites/{id}:
    delete:
      tags:
        - User Service
      summary: Удалить объект из избранного
      description: Удаляет объект из избранного текущего пользователя
      operationId: removeFavourite
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID записи в избранном
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Успешно удалено
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  # ==================== PROPERTY SERVICE ====================
  /properties:
    get:
      tags:
        - Property Service
      summary: Поиск объектов недвижимости
      description: Возвращает список объектов с фильтрацией и пагинацией
      operationId: searchProperties
      parameters:
        - $ref: '#/components/parameters/PaginationParams.page'
        - $ref: '#/components/parameters/PaginationParams.pageSize'
        - name: search
          in: query
          description: Поиск по названию или описанию
          schema:
            type: string
          examples:
            searchTerm:
              summary: Поисковый запрос
              value: "квартира в центре"
        - name: city
          in: query
          description: Фильтрация по городу
          schema:
            type: string
          examples:
            cityName:
              summary: Город
              value: "Москва"
        - name: minPricePerDay
          in: query
          description: Минимальная цена за сутки
          schema:
            type: number
            format: decimal
          examples:
            minPrice:
              summary: Минимальная цена
              value: 3000
        - name: maxPricePerDay
          in: query
          description: Максимальная цена за сутки
          schema:
            type: number
            format: decimal
          examples:
            maxPrice:
              summary: Максимальная цена
              value: 10000
        - name: minArea
          in: query
          description: Минимальная площадь (кв.м)
          schema:
            type: integer
            format: int32
        - name: maxArea
          in: query
          description: Максимальная площадь (кв.м)
          schema:
            type: integer
            format: int32
        - name: bedrooms
          in: query
          description: Количество спален
          schema:
            type: integer
            format: int32
        - name: bathrooms
          in: query
          description: Количество ванных комнат
          schema:
            type: integer
            format: int32
        - name: maxGuests
          in: query
          description: Максимальное количество гостей
          schema:
            type: integer
            format: int32
        - name: facilities
          in: query
          description: ID удобств (через запятую)
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: false
        - name: isAvailable
          in: query
          description: Только доступные объекты
          schema:
            type: boolean
        - name: typeId
          in: query
          description: ID типа недвижимости
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponseProperty'
              examples:
                propertiesList:
                  summary: Список объектов
                  value:
                    items:
                      - id: 10
                        ownerId: 1
                        typeId: 1
                        title: "Уютная квартира в центре"
                        description: "Светлая квартира с ремонтом"
                        pricePerDay: 5000
                        pricePerMonth: 120000
                        areaSqM: 45
                        maxGuests: 3
                        bedrooms: 1
                        bathrooms: 1
                        isAvailable: true
                        address:
                          id: 5
                          country: "Россия"
                          city: "Москва"
                          district: "Центральный"
                          houseNumber: "10"
                        images:
                          - id: 1
                            imageUrl: "https://cdn.example.com/img1.jpg"
                            isMain: true
                    total: 150
                    page: 1
                    pageSize: 10
        '400':
          description: Некорректные параметры фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalidFilter:
                  summary: Неверный параметр
                  value:
                    code: 400
                    message: "Некорректное значение параметра minPricePerDay"
                    details:
                      - field: "minPricePerDay"
                        error: "must be a number"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Сервис недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                serviceUnavailable:
                  summary: Сервис временно недоступен
                  value:
                    code: 503
                    message: "Сервис недвижимости временно недоступен"
                    retryAfter: 60

    post:
      tags:
        - Property Service
      summary: Создать объект недвижимости
      description: Создание нового объекта недвижимости (только для владельцев)
      operationId: createProperty
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
            examples:
              validProperty:
                summary: Корректные данные
                value:
                  typeId: 1
                  addressId: 5
                  title: "Уютная квартира в центре"
                  description: "Светлая квартира с современным ремонтом"
                  pricePerDay: 5000
                  pricePerMonth: 120000
                  areaSqM: 45
                  maxGuests: 3
                  bedrooms: 1
                  bathrooms: 1
                  isAvailable: true
                  minRentDays: 1
                  maxRentDays: 30
              missingField:
                summary: Отсутствует обязательное поле
                value:
                  typeId: 1
                  title: "Квартира"
                  # addressId отсутствует
      responses:
        '201':
          description: Объект успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          description: Некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validationError:
                  summary: Ошибка валидации
                  value:
                    code: 400
                    message: "Ошибка валидации данных"
                    details:
                      - field: "addressId"
                        error: "required"
                      - field: "pricePerDay"
                        error: "must be >= 0"
        '401':
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /properties/{id}:
    get:
      tags:
        - Property Service
      summary: Получить детали объекта
      description: Возвращает полную информацию об объекте недвижимости
      operationId: getPropertyById
      parameters:
        - name: id
          in: path
          required: true
          description: ID объекта недвижимости
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Успешный ответ
          content:
