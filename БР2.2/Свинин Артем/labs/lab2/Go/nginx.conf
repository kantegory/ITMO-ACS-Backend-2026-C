user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # =========================
    # Upstreams
    # =========================

    upstream auth_backend {
        server auth-service:8081;
    }

    upstream user_backend {
        server user-service:8082;
    }

    upstream property_backend {
        server property-service:8083;
    }

    upstream booking_backend {
        server booking-service:8084;
    }

    upstream payment_backend {
        server payment-service:8085;
    }

    upstream review_backend {
        server review-service:8086;
    }

    upstream communication_backend {
        server communication-service:8087;
    }

    # =========================
    # API Gateway
    # =========================

    server {
        listen 8080;
        server_name _;

        # Health check
        location /health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # =========================
        # AUTH
        # =========================
        location /v1/auth/ {
            proxy_pass http://auth_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # USERS
        # =========================
        location /v1/users/ {
            proxy_pass http://user_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # PROPERTY
        # =========================
        location /v1/properties/ {
            proxy_pass http://property_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # BOOKING
        # =========================
        location /v1/bookings/ {
            proxy_pass http://booking_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # PAYMENT
        # =========================
        location /v1/payments/ {
            proxy_pass http://payment_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # REVIEW
        # =========================
        location /v1/reviews/ {
            proxy_pass http://review_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # MESSAGES
        # =========================
        location /v1/messages/ {
            proxy_pass http://communication_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # ROOT
        # =========================
        location / {
            add_header Content-Type application/json;
            return 200 '{"message":"API Gateway is running","version":"1.0.0"}';
        }

        # =========================
        # FALLBACK (ONLY EXACT MATCH)
        # =========================
        location = /v1/ {
            add_header Content-Type application/json;
            return 404 '{"error":"endpoint not found"}';
        }
    }
}