x-common-env: &common-env
  SERVICE_TOKEN: "${SERVICE_TOKEN:-internal-service-token}"
  KAFKA_BROKER: "${KAFKA_BROKER:-kafka:9092}"

x-postgres-env: &postgres-env
  POSTGRES_USER: "${POSTGRES_USER:-app}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app}"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-9080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # DATABASES 

  auth-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "auth_db"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "user_db"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  property-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "property_db"
    volumes:
      - property_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d property_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "booking_db"
    volumes:
      - booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "payment_db"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  review-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "review_db"
    volumes:
      - review_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d review_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  communication-db:
    image: postgres:16-alpine
    environment:
      <<: *postgres-env
      POSTGRES_DB: "communication_db"
    volumes:
      - communication_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d communication_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #API GATEWAY 

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - property-service
      - booking-service
      - payment-service
      - review-service
      - communication-service
    restart: unless-stopped

  #SERVICES

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    environment:
      <<: *common-env
      PORT: "8081"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-very-long-secret}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@auth-db:5432/auth_db"
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
    environment:
      <<: *common-env
      PORT: "8082"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@user-db:5432/user_db"
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  property-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: property
    environment:
      <<: *common-env
      PORT: "8083"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      USER_SERVICE_URL: "http://user-service:8082"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@property-db:5432/property_db"
    depends_on:
      property-db:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: booking
    environment:
      <<: *common-env
      PORT: "8084"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      PROPERTY_SERVICE_URL: "http://property-service:8083"
      USER_SERVICE_URL: "http://user-service:8082"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@booking-db:5432/booking_db"
    depends_on:
      kafka:
        condition: service_healthy
      booking-db:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    environment:
      <<: *common-env
      PORT: "8085"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      BOOKING_SERVICE_URL: "http://booking-service:8084"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@payment-db:5432/payment_db"
    depends_on:
      kafka:
        condition: service_healthy
      payment-db:
        condition: service_healthy
    restart: unless-stopped

  review-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: review
    environment:
      <<: *common-env
      PORT: "8086"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@review-db:5432/review_db"
    depends_on:
      kafka:
        condition: service_healthy
      review-db:
        condition: service_healthy
    restart: unless-stopped

  communication-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: communication
    environment:
      <<: *common-env
      PORT: "8087"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@communication-db:5432/communication_db"
    depends_on:
      kafka:
        condition: service_healthy
      communication-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  auth_db_data:
  user_db_data:
  property_db_data:
  booking_db_data:
  payment_db_data:
  review_db_data:
  communication_db_data:
