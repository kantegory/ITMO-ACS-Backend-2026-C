services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../lab2/sql:/sql:ro
      - ../lab1/sql:/monolith-sql:ro
      - ./init-monolith.sql:/docker-entrypoint-initdb.d/zz-monolith.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -h 127.0.0.1']
      interval: 5s
      retries: 10
  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Set RABBIT_PASSWORD in .env}
    ports:
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_listener, '5672']
      interval: 5s
      retries: 20
  users:
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/users/me').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    build: ../lab2/users
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/users_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  restaurants:
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/api/restaurants').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    build: ../lab2/restaurants
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/restaurants_db
      INTERNAL_KEY: ${INTERNAL_KEY:?Set INTERNAL_KEY in .env}
      RABBITMQ_URL: amqp://student:${RABBIT_PASSWORD}@rabbitmq:5672
    ports:
      - '127.0.0.1:3002:3002'
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
  bookings:
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/api/bookings').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    build: ../lab2/bookings
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/bookings_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      RESTAURANTS_URL: http://restaurants:3002
      RABBITMQ_URL: amqp://student:${RABBIT_PASSWORD}@rabbitmq:5672
    ports:
      - '127.0.0.1:3003:3003'
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      restaurants: { condition: service_started }
    restart: unless-stopped
  monolith:
    build: ../lab1
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432/booking
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/restaurants').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
  nginx:
    image: nginx:stable-alpine
    ports:
      - '${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - ../lab4/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      users: { condition: service_healthy }
      restaurants: { condition: service_healthy }
      bookings: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 3s
      retries: 15
  tools:
    profiles: [tools]
    build:
      context: ../../homeworks/hw3
      dockerfile: Dockerfile
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      NODE_PATH: /opt/tools/node_modules
    volumes:
      - ../..:/workspace
volumes:
  pgdata:
  rabbitdata:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.80.0/24}
