server {
    listen 80;
    server_name _;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location /api/auth/ { proxy_pass http://users:3001; }
    location /api/users/ { proxy_pass http://users:3001; }
    location /api/restaurants { proxy_pass http://restaurants:3002; }
    location /api/cities { proxy_pass http://restaurants:3002; }
    location /api/cuisines { proxy_pass http://restaurants:3002; }
    location /api/bookings { proxy_pass http://bookings:3003; }
    location / { return 404; }
}
