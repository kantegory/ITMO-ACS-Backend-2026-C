openapi: 3.0.0
info:
  title: Venus' Vegetarian Ward
  version: 0.0.0
tags:
  - name: Auth
  - name: User
  - name: Recipes
  - name: Comments
paths:
  /api/auth/login:
    post:
      operationId: Auth_login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/logout:
    post:
      operationId: Auth_logout
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
  /api/auth/register:
    post:
      operationId: Auth_register
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/comments/{id}:
    delete:
      operationId: Comments_delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Comments
      security:
        - BearerAuth: []
  /api/comments/{recipe_id}:
    get:
      operationId: Comments_comment_list
      parameters:
        - name: recipe_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
      tags:
        - Comments
    post:
      operationId: Comments_add_comment
      parameters:
        - name: recipe_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment_body:
                  type: string
              required:
                - comment_body
      security:
        - BearerAuth: []
  /api/recipes:
    get:
      operationId: Recipes_recipe_list
      parameters:
        - name: title
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: ingredient
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Ingredient'
          explode: false
        - name: skill
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Skill'
          explode: false
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Category'
          explode: false
        - name: sortBy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortBy'
          explode: false
        - name: sortDirection
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SortHow'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
      tags:
        - Recipes
    post:
      operationId: Recipes_new_recipe
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
      tags:
        - Recipes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeData'
      security:
        - BearerAuth: []
  /api/recipes/{id}:
    get:
      operationId: Recipes_get_recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
      tags:
        - Recipes
  /api/users:
    get:
      operationId: Users_users_list
      parameters:
        - name: role
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UserRole'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
      tags:
        - User
  /api/users/{id}:
    get:
      operationId: Users_get_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - User
    put:
      operationId: Users_update_user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      security:
        - BearerAuth: []
  /api/users/{id}/recipes/published:
    get:
      operationId: Users_published_recipes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedRecipe'
      tags:
        - User
  /api/users/{id}/recipes/published/{recipe_id}:
    put:
      operationId: Users_update_recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: recipe_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeData'
      security:
        - BearerAuth: []
  /api/users/{id}/recipes/saved:
    get:
      operationId: Users_saved_recipes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedRecipe'
      tags:
        - User
  /api/users/{id}/recipes/saved/{recipe_id}:
    delete:
      operationId: Users_remove_recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: recipe_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - User
      security:
        - BearerAuth: []
  /api/users/{id}/{recipe_id}:
    delete:
      operationId: Users_delete_recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: recipe_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - User
      security:
        - BearerAuth: []
components:
  schemas:
    Category:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
    Comment:
      type: object
      required:
        - id
        - comment_body
        - published_at
        - author
        - recipe
      properties:
        id:
          type: integer
          format: int32
        comment_body:
          type: string
        published_at:
          type: string
          format: date
        author:
          $ref: '#/components/schemas/User'
        recipe:
          $ref: '#/components/schemas/Recipe'
    Ingredient:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    PublishedRecipe:
      type: object
      required:
        - id
        - recipe
        - is_mine
        - published_at
      properties:
        id:
          type: integer
          format: int32
        recipe:
          $ref: '#/components/schemas/Recipe'
        is_mine:
          type: boolean
        published_at:
          type: string
          format: date
    Recipe:
      type: object
      required:
        - id
        - title
        - description
        - step
        - rating
        - published_at
        - author
        - ingredient
        - skill
        - category
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        step:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        rating:
          type: number
        published_at:
          type: string
          format: date
        author:
          $ref: '#/components/schemas/User'
        ingredient:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        skill:
          $ref: '#/components/schemas/Skill'
        category:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    RecipeData:
      type: object
      required:
        - title
        - description
        - step
        - ingredient
        - skill
        - category
      properties:
        title:
          type: string
        description:
          type: string
        step:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        ingredient:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        skill:
          $ref: '#/components/schemas/Skill'
        category:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    RecipeIngredient:
      type: object
      required:
        - id
        - amount
        - ingredient
        - recipe
      properties:
        id:
          type: integer
          format: int32
        amount:
          type: number
        unit:
          $ref: '#/components/schemas/Unit'
        ingredient:
          $ref: '#/components/schemas/Ingredient'
        recipe:
          $ref: '#/components/schemas/Recipe'
    RegisterRequest:
      type: object
      required:
        - first_name
        - last_name
        - username
        - email
        - password
        - profile_pic
      properties:
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        profile_pic:
          type: string
    SavedRecipe:
      type: object
      required:
        - id
        - recipe
        - saved_by
        - saved_at
      properties:
        id:
          type: integer
          format: int32
        recipe:
          $ref: '#/components/schemas/Recipe'
        saved_by:
          $ref: '#/components/schemas/User'
        saved_at:
          type: string
          format: date
    Skill:
      type: object
      required:
        - id
        - level
      properties:
        id:
          type: integer
          format: int32
        level:
          type: string
    SortBy:
      type: string
      enum:
        - title
        - skill
        - rating
        - created_at
    SortHow:
      type: string
      enum:
        - asc
        - desc
    Step:
      type: object
      required:
        - id
        - instruction
        - recipe
      properties:
        id:
          type: integer
          format: int32
        instruction:
          type: string
        image:
          type: string
        recipe:
          $ref: '#/components/schemas/Recipe'
    Unit:
      type: string
      enum:
        - g
        - lbs
        - ml
        - tsp
        - tbsp
        - cup
        - pcs
    User:
      type: object
      required:
        - id
        - role
        - first_name
        - last_name
        - username
        - email
        - is_verified
        - created_at
      properties:
        id:
          type: integer
          format: int32
        role:
          $ref: '#/components/schemas/UserRole'
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        email:
          type: string
        profile_pic:
          type: string
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date
    UserRole:
      type: string
      enum:
        - Admin
        - User
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
