$kind: http-request
name: "14. Личный кабинет: мои рецепты"
url: "{{baseUrl}}/users/me/recipes"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));

      pm.test('Созданный рецепт виден в личном кабинете', () => {
          const json = pm.response.json();
          const recipeId = Number(pm.collectionVariables.get('recipeId'));
          pm.expect(json.some((r) => r.id === recipeId)).to.be.true;
      });
    language: text/javascript
order: 14000
