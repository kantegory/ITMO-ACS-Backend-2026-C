$kind: http-request
url: "{{baseUrl}}/comments/recipe/{{recipeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Статус 200', () => pm.response.to.have.status(200));

      pm.test('Добавленный комментарий виден в списке', () => {
          const json = pm.response.json();
          const commentId = Number(pm.collectionVariables.get('commentId'));
          const found = json.find((c) => c.id === commentId);
          pm.expect(found, 'комментарий не найден').to.not.be.undefined;
      });
    language: text/javascript
order: 12000
