services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: lakomka_users
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakomka_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lakomka-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lakomka
      RABBITMQ_DEFAULT_PASS: lakomka
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lakomka-net

  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
      DB_DATABASE: lakomka_users
      RABBITMQ_URL: amqp://lakomka:lakomka@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lakomka-net

  recipes-service:
    build:
      context: ./recipes-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
      DB_DATABASE: lakomka_recipes
      RABBITMQ_URL: amqp://lakomka:lakomka@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lakomka-net

  interactions-service:
    build:
      context: ./interactions-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
      DB_DATABASE: lakomka_interactions
      RABBITMQ_URL: amqp://lakomka:lakomka@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - lakomka-net

volumes:
  postgres_data:

networks:
  lakomka-net:
    driver: bridge
