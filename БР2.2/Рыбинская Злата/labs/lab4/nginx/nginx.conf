events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Split /recipes/* between recipes-service and interactions-service (same path prefix in Nest).
    upstream users_upstream {
        server users-service:3001;
    }
    upstream recipes_upstream {
        server recipes-service:3002;
    }
    upstream interactions_upstream {
        server interactions-service:3003;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 25m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location ~ ^/recipes/[^/]+/(comments|like|rating) {
            proxy_pass http://interactions_upstream;
        }

        location /recipes/ {
            proxy_pass http://recipes_upstream;
        }

        location = /recipes {
            proxy_pass http://recipes_upstream;
        }

        location /ingredients {
            proxy_pass http://recipes_upstream;
        }

        location /users {
            proxy_pass http://users_upstream;
        }

        location /auth {
            proxy_pass http://users_upstream;
        }

        location = / {
            default_type text/plain;
            return 200 "lakomka lab4 up\n";
        }

        location / {
            return 404;
        }
    }
}
